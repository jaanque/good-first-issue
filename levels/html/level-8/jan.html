<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>jaanque - HTML Level 8</title>
  </head>
  <body>
    <h1>Feedback & Contact Form</h1>

    <form action="#" method="POST">
      <div>
        <label for="username">GitHub Username:</label><br>
        <input type="text" id="username" name="username" value="jaanque" required>
      </div>
      <br>
      <div>
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
      </div>
      <br>
      <div>
        <label for="track">Preferred Track:</label><br>
        <select id="track" name="track">
          <option value="python">Python</option>
          <option value="html" selected>HTML</option>
          <option value="css">CSS</option>
          <option value="js">JavaScript</option>
        </select>
      </div>
      <br>
      <div>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="40" placeholder="Your comments..."></textarea>
      </div>
      <br>
      <button type="submit">Submit Feedback</button>
    </form>
  </body>
</html>
