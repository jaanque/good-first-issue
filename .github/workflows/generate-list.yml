name: Update Contributors List

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Combine JSON files
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');
        const cardsDir = path.join(process.cwd(), 'assets', 'cards');
        
        if (fs.existsSync(cardsDir)) {
          const files = fs.readdirSync(cardsDir).filter(f => f.endsWith('.json'));
          const data = files.map(f => {
            try {
              return JSON.parse(fs.readFileSync(path.join(cardsDir, f)));
            } catch (e) {
              console.error('Error parsing file:', f);
              return null;
            }
          }).filter(item => item !== null);
          
          fs.writeFileSync('final-list.json', JSON.stringify(data));
        } else {
          console.log('The assets/cards directory does not exist yet.');
        }
        "

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add final-list.json
        git commit -m "Auto-generate: Update final-list.json with new contributors" || echo "No changes to commit"
        git push
